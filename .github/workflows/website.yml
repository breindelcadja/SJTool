# Publishes the website/ folder to GitHub Pages whenever it changes on main.
# One-time setup (repo owner): Settings > Pages > Build and deployment >
# Source: "GitHub Actions". The site's link then appears on that page.
name: Publish website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses:.github/workflows/website.yml
